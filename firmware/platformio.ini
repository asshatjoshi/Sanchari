[platformio]
default_envs = esp32dev

; The wheelchair controller (ESP32 DevKit V1 / ESP32-WROOM-32 dev boards).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  knolleary/PubSubClient@^2.8
  mikalhart/TinyGPSPlus@^1.1.0
  bblanchon/ArduinoJson@^7.2.0
test_ignore = *

; Unit tests for hardware-independent code, run on this PC: pio test -e native
[env:native]
platform = native
test_framework = unity
